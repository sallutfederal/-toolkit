general:
  log_level: INFO
  log_dir: logs
  output_dir: output

network_discovery:
  default_timeout: 3
  max_threads: 100
  default_ports:
    - 21
    - 22
    - 23
    - 25
    - 53
    - 80
    - 110
    - 135
    - 139
    - 443
    - 445
    - 993
    - 995
    - 1433
    - 1521
    - 3306
    - 3389
    - 5432
    - 5900
    - 8080
    - 8443
    - 8888
    - 9200
    - 9443

file_generator:
  output_dir: output
  default_record_count: 100
  patterns:
    credit_card:
      prefix: "4"
      length: 16
    ssn:
      format: "XXX-XX-XXXX"
    email:
      domain: "example.com"
    ip_address:
      subnet: "10.0.0.0/24"

remote_communication:
  telegram:
    bot_token: ""
    api_url: "https://api.telegram.org/bot"
    poll_timeout: 30
    max_message_length: 4096
    chat_id: ""

vulnerability_bridge:
  msfrpc:
    host: "127.0.0.1"
    port: 55553
    password: "msf"
    ssl: false
    timeout: 30

device_profiler:
  snmp:
    community: "public"
    port: 161
    timeout: 5
  ssh:
    port: 22
    timeout: 10
  http:
    port: 80
    timeout: 5
  user_agents:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    - "curl/7.68.0"

transaction_analyzer:
  supported_formats:
    - json
    - csv
  suspicious_threshold: 10000
  chain_id: 1
  rpc_url: "http://localhost:8545"

email_campaign:
  smtp:
    host: "127.0.0.1"
    port: 25
    use_tls: false
  templates:
    - phishing_credential
    - phishing_invoice
    - phishing_document
    - phishing_it_alert
  obfuscation_methods:
    - hex_encode
    - entity_encode
    - base64
    - redirect_chain
  default_count: 10

file_encryption:
  default_password: "TestPassword123!"
  default_archive_format: zip
  compression: gzip
  supported_formats:
    - zip
    - 7z
    - rar
    - tar.gz

credential_harvester:
  common_login_urls:
    - /login
    - /signin
    - /admin/login
    - /wp-login.php
  max_form_fields: 50
  extract_query_params: true

lateral_movement:
  default_ports:
    - 135
    - 139
    - 445
    - 3389
    - 5985
    - 5986
    - 22
    - 443
  max_threads: 50
  min_trust_score: 3
  scan_timeout: 3

data_exfiltration:
  channels:
    - dns
    - http
    - icmp
  encodings:
    - base64
    - base64_urlsafe
    - hex
  compression: gzip
  dns_max_chunk: 63
  http_max_chunk: 4096
  icmp_max_chunk: 32

persistent_access:
  platforms:
    - windows
    - linux
    - darwin
  default_agent_path: null
  methods:
    - registry_run
    - scheduled_task
    - startup_folder
    - cron
    - systemd_service
    - bashrc
    - launchd
  verify_edr_coverage: true

social_engineering:
  channels:
    - sms
    - whatsapp
    - email
  ab_test_variants: 10
  max_messages_per_campaign: 1000
  default_template_index: 0

blockchain_forensic:
  supported_chains:
    - ethereum
    - bsc
    - polygon
    - bitcoin
    - avalanche
    - arbitrum
  suspicious_threshold: 50000
  default_depth: 4
  max_trace_results: 100